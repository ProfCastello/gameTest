<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavras Cruzadas - GameTest</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="backgroundAnimation"></div>
    
    <header>
        <h1>Palavras Cruzadas</h1>
        <div id="gameStats">
            <span id="wordsFound">Palavras: 0</span>
            <span id="totalWords">Total: 0</span>
        </div>
    </header>

    <main>
        <!-- Menu de seleção -->
        <div id="menuScreen" class="screen active">
            <div class="menu-container">
                <h2>Escolha a Dificuldade</h2>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-words="5">5 Palavras</button>
                    <button class="difficulty-btn" data-words="10">10 Palavras</button>
                    <button class="difficulty-btn" data-words="15">15 Palavras</button>
                    <button class="difficulty-btn" data-words="20">20 Palavras</button>
                    <button class="difficulty-btn" data-words="30">30 Palavras</button>
                    <button class="difficulty-btn" data-words="50">50 Palavras</button>
                </div>
            </div>
        </div>

        <!-- Tela do jogo -->
        <div id="gameScreen" class="screen">
            <div class="game-container">
                <div id="crosswordGrid"></div>
                
                <div class="game-controls">
                    <button id="newGameBtn">Novo Jogo</button>
                    <button id="hintBtn">Dica</button>
                    <button id="checkBtn">Verificar</button>
                </div>
                
                <div id="cluesContainer">
                    <div class="clues-section">
                        <h3>Horizontais</h3>
                        <div id="horizontalClues" class="clues-list"></div>
                    </div>
                    <div class="clues-section">
                        <h3>Verticais</h3>
                        <div id="verticalClues" class="clues-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Teclado virtual -->
    <div id="virtualKeyboard" class="keyboard">
        <div class="keyboard-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
            <button class="key" data-key="Ç">Ç</button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>
            <button class="key special" data-key="BACKSPACE">⌫</button>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="crossword_improved.js"></script>
    <script src="game.js"></script>
</body>
</html>
